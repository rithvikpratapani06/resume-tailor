<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resume Tailor">
<title>Resume Tailor</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d1f23;--muted:#5f6670;--border:#e2e5ea;--accent:#2563eb;--ok-bg:#e7f6ec;--ok:#1e7a3c;--eq-bg:#e6effd;--eq:#1d4ed8;--warn-bg:#fdf1dc;--warn:#8a5a00;--err:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
textarea{resize:vertical;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px}
.inline>*:first-child{flex:1}
button{font:inherit;font-size:14px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:wait}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.msg{font-size:13px;margin:6px 0 0;min-height:1em;white-space:pre-line}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.metric{background:var(--bg);border-radius:8px;padding:12px}
.metric span{display:block;font-size:12px;color:var(--muted)}
.metric b{font-size:22px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:6px;margin:0 6px 6px 0}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.eq{background:var(--eq-bg);color:var(--eq)}.chip.miss{background:var(--warn-bg);color:var(--warn)}
.small{font-size:13px;color:var(--muted);margin:8px 0}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 12px;white-space:pre-line}
.hidden{display:none}
pre.notes{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:8px;font:inherit;font-size:14px;margin:12px 0 0}
#printArea{display:none}
@media(max-width:600px){
  main{padding:16px 12px 48px}
  .row{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .inline{flex-direction:column}
  input,select,textarea{font-size:16px}
  .actions button{flex:1 1 100%;padding:12px}
}
@media print{
  @page{size:A4;margin:0.55in 0.6in}
  body{background:#fff}
  main{display:none!important}
  #printArea{display:block;font-family:Calibri,Carlito,Arial,sans-serif;font-size:10.5pt;color:#000;line-height:1.3}
  #printArea h1{font-size:18pt;text-align:center;margin:0 0 2px;letter-spacing:.5px}
  #printArea .c{text-align:center;margin:0 0 4px}
  #printArea h2{font-size:11pt;border-bottom:1px solid #000;margin:9px 0 4px;padding-bottom:1px;letter-spacing:.5px}
  #printArea p{margin:2px 0}
  #printArea ul{margin:2px 0 4px;padding-left:16px}
  #printArea li{margin:1px 0}
}
</style>
</head>
<body>
<main>
<h1>Resume Tailor</h1>
<p class="sub">Paste any job description, check your keyword match, and get an honest, tailored resume.</p>

<section class="card">
<h2>1. Settings</h2>
<label for="apiKey">Gemini API key (stored only in this browser)</label>
<div class="inline"><input id="apiKey" type="password" placeholder="Paste your key from Google AI Studio" autocomplete="off"><button id="saveKey">Save key</button></div>
<label for="model">Preferred model (others are tried automatically if it fails)</label>
<div class="inline"><select id="model"></select><button id="loadModels">Refresh models</button></div>
<p class="msg" id="setMsg"></p>
</section>

<section class="card">
<h2>2. Your base resume</h2>
<textarea id="resume" rows="14"></textarea>
<div class="actions"><button id="resetResume">Restore original</button></div>
<p class="small">Changes save automatically in this browser.</p>
</section>

<section class="card">
<h2>3. Job details</h2>
<div class="row">
<div><label for="role">Target role (optional)</label><input id="role" placeholder="Python GenAI Developer"></div>
<div><label for="company">Company (optional)</label><input id="company" placeholder="Infosys"></div>
</div>
<label for="jd">Job description</label>
<textarea id="jd" rows="10" placeholder="Paste the full job description here"></textarea>
<div class="actions"><button id="checkBtn">Check match</button><button id="tailorBtn" class="primary">Tailor my resume</button></div>
<p class="msg" id="jdMsg"></p>
</section>

<section class="card hidden" id="matchCard">
<h2>Keyword match</h2>
<div id="matchOut"></div>
</section>

<section class="card hidden" id="resultCard">
<h2>Tailored resume</h2>
<p class="small" id="afterOut"></p>
<div class="warnbox hidden" id="warnOut"></div>
<textarea id="output" rows="24"></textarea>
<div class="actions"><button id="copyBtn">Copy text</button><button id="pdfBtn" class="primary">Download PDF</button></div>
<p class="msg" id="outMsg"></p>
<pre class="notes hidden" id="notes"></pre>
</section>
</main>
<div id="printArea"></div>

<script>
const RESUME_VERSION = '2';
const DEFAULT_RESUME = `RITHVIK PRATAPANI

const DEFAULT_MODELS = ["gemini-3.6-flash","gemini-3.5-flash","gemini-3.1-flash-lite","gemini-3-flash-preview","gemini-2.5-flash","gemini-2.5-flash-lite"];
const API = "https://generativelanguage.googleapis.com/v1beta";
const TIMEOUT_MS = 60000;

const K=[["Node.js",["node.js","nodejs","node js"]],["Express.js",["express.js","expressjs","express"]],["Fastify",["fastify"]],["NestJS",["nestjs","nest.js"]],["FastAPI",["fastapi"]],["Django",["django"]],["Flask",["flask"]],["Spring Boot",["spring boot","spring"]],["Java",["java"]],["Python",["python"]],["JavaScript",["javascript"]],["TypeScript",["typescript"]],["Go",["golang"]],["C++",["c++"]],["C#",["c#"]],[".NET",[".net"]],["Kotlin",["kotlin"]],["Rust",["rust"]],["PHP",["php"]],["Laravel",["laravel"]],["Ruby on Rails",["ruby on rails","rails"]],["SQL",["sql"]],["NoSQL",["nosql"]],["MongoDB",["mongodb","mongo"]],["Mongoose",["mongoose"]],["PostgreSQL",["postgresql","postgres"]],["MySQL",["mysql"]],["Redis",["redis"]],["DynamoDB",["dynamodb"]],["Elasticsearch",["elasticsearch"]],["Kafka",["kafka"]],["RabbitMQ",["rabbitmq"]],["Celery",["celery"]],["MQTT",["mqtt"]],["GraphQL",["graphql"]],["REST APIs",["rest api","rest apis","restful"]],["gRPC",["grpc"]],["Microservices",["microservices","microservice"]],["Backend",["backend","back-end","back end"]],["Frontend",["frontend","front-end","front end"]],["Full stack",["full stack","full-stack","fullstack"]],["React",["react","react.js"]],["Angular",["angular"]],["Vue",["vue","vue.js"]],["Next.js",["next.js","nextjs"]],["Cloud",["cloud","cloud computing"]],["AWS",["aws","amazon web services"]],["Lambda",["lambda"]],["S3",["s3"]],["API Gateway",["api gateway"]],["Cognito",["cognito"]],["EC2",["ec2"]],["Azure",["azure"]],["GCP",["gcp","google cloud"]],["Serverless",["serverless"]],["Docker",["docker"]],["Kubernetes",["kubernetes","k8s"]],["Helm",["helm"]],["Terraform",["terraform"]],["Ansible",["ansible"]],["CI/CD",["ci/cd","cicd","ci cd"]],["Jenkins",["jenkins"]],["GitHub Actions",["github actions"]],["Git",["git","github","gitlab"]],["Linux",["linux"]],["Nginx",["nginx"]],["Monitoring",["monitoring","observability","prometheus","grafana"]],["Unit testing",["unit test","unit tests","unit testing"]],["Jest",["jest"]],["Pytest",["pytest"]],["Selenium",["selenium"]],["Playwright",["playwright"]],["Postman",["postman"]],["Swagger",["swagger","openapi spec"]],["System design",["system design"]],["DSA",["data structures","algorithms","dsa"]],["OOP",["oop","object-oriented","object oriented"]],["Design patterns",["design patterns"]],["Scalability",["scalability","scalable"]],["Performance optimization",["performance optimization","performance tuning","optimize","optimization"]],["Security",["security","secure coding"]],["JWT",["jwt"]],["OAuth",["oauth"]],["Authentication",["authentication","auth"]],["Caching",["caching","cache"]],["Real-time systems",["real-time","realtime","real time"]],["Event-driven",["event-driven","event driven"]],["IoT",["iot"]],["ETL",["etl","data pipeline","data pipelines"]],["Spark",["spark","pyspark"]],["Airflow",["airflow"]],["Pandas",["pandas"]],["NumPy",["numpy"]],["Power BI",["power bi"]],["Tableau",["tableau"]],["Excel",["excel"]],["Machine learning",["machine learning"]],["TensorFlow",["tensorflow"]],["PyTorch",["pytorch"]],["Hugging Face",["hugging face","huggingface"]],["Fine-tuning",["fine-tuning","fine tuning","finetuning"]],["MLOps",["mlops"]],["LLM",["llm","llms","large language model","large language models"]],["Generative AI",["generative ai","genai","gen ai"]],["RAG",["rag","retrieval-augmented","retrieval augmented"]],["AI agents",["ai agents","agentic","autogen","crewai"]],["LangChain",["langchain"]],["LlamaIndex",["llamaindex"]],["OpenAI",["openai"]],["Azure OpenAI",["azure openai"]],["Vertex AI",["vertex ai"]],["AWS Bedrock",["bedrock"]],["Gemini",["gemini"]],["Prompt engineering",["prompt engineering"]],["Vector database",["vector database","vector databases","vector db","pgvector","pinecone","faiss","chromadb","vector search"]],["Embeddings",["embedding","embeddings"]],["Semantic search",["semantic search"]],["NLP",["nlp","natural language processing"]],["Copilot",["copilot"]],["WebSockets",["websocket","websockets","socket.io"]],["Agile",["agile","scrum"]],["Debugging",["debugging","troubleshooting"]],["Problem solving",["problem solving","problem-solving"]],["Communication",["communication"]],["Collaboration",["collaboration","teamwork","team player"]]];

const EQ_SRC = {
  "Generative AI":["llm","llms","gemini","openai","large language model"],
  "LLM":["gemini","generative ai","openai"],
  "RAG":["semantic retrieval"],
  "Debugging":["debugged","resolved","traced","troubleshot"],
  "Problem solving":["debugged","resolved","optimized"],
  "REST APIs":["rest endpoints","api endpoints","rest api design"],
  "Vector database":["pgvector","vector search","vector store"],
  "Semantic search":["semantic retrieval"],
  "Embeddings":["sentence transformers"],
  "Caching":["cached"],
  "Cloud":["aws","azure","gcp"],
  "NoSQL":["mongodb","dynamodb"],
  "SQL":["postgresql","mysql"],
  "Authentication":["jwt","cognito","oauth"],
  "Serverless":["lambda"],
  "JavaScript":["node.js","nodejs"],
  "Backend":["node.js","fastapi","fastify","django"],
  "Event-driven":["mqtt"],
  "Performance optimization":["latency","cutting","reduced"],
  "IoT":["sensors","telemetry"]
};

const esc = s => s.replace(/[.*+?^${}()|[\]\\\/#]/g,'\\$&');
const mk = a => new RegExp('(?:^|[^a-z0-9])(?:'+a.map(esc).join('|')+')(?![a-z0-9])','i');
const RX = K.map(([l,a]) => [l, mk(a)]);
const EQ = Object.fromEntries(Object.entries(EQ_SRC).map(([l,a]) => [l, mk(a)]));

const $ = id => document.getElementById(id);
const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const msg = (id,text,type) => { $(id).textContent = text; $(id).className = 'msg ' + (type||''); };
const escH = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shortMsg = s => (s || '').split('\n')[0].slice(0, 90);

if (store.get('rt_resume_ver') !== RESUME_VERSION) {
  const old = store.get('rt_resume');
  if (old) store.set('rt_resume_backup', old);
  store.set('rt_resume', DEFAULT_RESUME);
  store.set('rt_resume_ver', RESUME_VERSION);
}

function getModelList(){ return JSON.parse(store.get('rt_models') || 'null') || DEFAULT_MODELS; }
function fillModels(list, selected){
  $('model').innerHTML = list.map(m => `<option value="${escH(m)}">${escH(m)}</option>`).join('');
  if (selected && list.includes(selected)) $('model').value = selected;
}

$('apiKey').value = store.get('rt_key') || '';
fillModels(getModelList(), store.get('rt_model'));
$('resume').value = store.get('rt_resume') || DEFAULT_RESUME;

$('model').onchange = () => store.set('rt_model', $('model').value);
$('resume').oninput = () => store.set('rt_resume', $('resume').value);
$('jd').oninput = () => msg('jdMsg','');
$('resetResume').onclick = () => { if (confirm('Replace your base resume with the original version?')) { $('resume').value = DEFAULT_RESUME; store.set('rt_resume', DEFAULT_RESUME); } };

async function fetchModels(key){
  const r = await fetch(`${API}/models?pageSize=200`, {headers:{'x-goog-api-key':key}});
  let d = {}; try { d = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(d.error?.message || 'HTTP ' + r.status);
  const list = (d.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace('models/',''))
    .filter(n => n.includes('gemini') && !/(embed|image|tts|audio|live|vision|robotics|computer-use)/.test(n));
  if (!list.length) throw new Error('No text models found for this key.');
  list.sort((a,b) => b.localeCompare(a, undefined, {numeric:true}));
  store.set('rt_models', JSON.stringify(list));
  store.set('rt_models_loaded', '1');
  fillModels(list, store.get('rt_model'));
  store.set('rt_model', $('model').value);
  return list;
}

async function loadModelsUI(){
  const key = $('apiKey').value.trim();
  if (!key) return msg('setMsg','Paste your API key first.','err');
  msg('setMsg','Loading models…');
  try { const list = await fetchModels(key); msg('setMsg', `${list.length} models loaded. If one fails, the others are tried automatically.`, 'ok'); }
  catch(e) { msg('setMsg','Could not load models: ' + e.message, 'err'); }
}

$('saveKey').onclick = async () => {
  const key = $('apiKey').value.trim();
  if (!key) return msg('setMsg','Paste your API key first.','err');
  store.set('rt_key', key);
  await loadModelsUI();
};
$('loadModels').onclick = loadModelsUI;

function orderModels(){
  const sel = $('model').value;
  const rank = n => (/pro/.test(n) ? 3 : /lite/.test(n) ? 1 : /flash/.test(n) ? 0 : 2) + (/(preview|exp)/.test(n) ? 0.5 : 0);
  const rest = getModelList().filter(m => m !== sel)
    .sort((a,b) => rank(a) - rank(b) || b.localeCompare(a, undefined, {numeric:true}));
  return [sel, ...rest].filter(Boolean);
}

async function callModel(model, key, prompt){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const r = await fetch(`${API}/models/${encodeURIComponent(model)}:generateContent`, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body: JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}], generationConfig:{temperature:0.3}}),
      signal: ctrl.signal
    });
    let d = {}; try { d = await r.json(); } catch(e) {}
    if (!r.ok) { const err = new Error(d.error?.message || 'HTTP ' + r.status); err.status = r.status; throw err; }
    const text = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
    if (!text) { const err = new Error('Empty response'); err.status = 0; throw err; }
    return text;
  } catch(e) {
    if (e.name === 'AbortError') { const err = new Error('No response in ' + TIMEOUT_MS/1000 + ' seconds'); err.status = 0; throw err; }
    throw e;
  } finally { clearTimeout(timer); }
}

const isKeyError = e => [400,401,403].includes(e.status) && /api[\s_-]?key/i.test(e.message);

function analyze(jd, rs){
  const inJd = RX.filter(([,r]) => r.test(jd));
  const hit = [], equiv = [], miss = [];
  for (const [l,r] of inJd) {
    if (r.test(rs)) hit.push(l);
    else if (EQ[l] && EQ[l].test(rs)) equiv.push(l);
    else miss.push(l);
  }
  const t = inJd.length;
  return {hit, equiv, miss, total:t,
    score: t ? Math.round(hit.length / t * 100) : 0,
    potential: t ? Math.round((hit.length + equiv.length) / t * 100) : 0};
}

function renderMatch(a){
  const color = a.score >= 75 ? 'var(--ok)' : a.score >= 50 ? 'var(--warn)' : 'var(--err)';
  const tip = a.total === 0 ? 'No common keywords found in this job description. Tailoring will still adapt the wording.'
    : a.potential >= 75 ? 'Strong fit. Tailoring should push your score close to the potential.'
    : a.potential >= 50 ? 'Decent fit. Tailoring will add the honest equivalents.'
    : 'Low fit. Check whether this role really matches your skills before applying.';
  const chips = (arr, cls) => arr.map(h => `<span class="chip ${cls}">${escH(h)}</span>`).join('');
  $('matchOut').innerHTML =
    `<div class="metrics">
      <div class="metric"><span>Keyword match</span><b style="color:${color}">${a.score}%</b></div>
      <div class="metric"><span>Honest potential</span><b>${a.potential}%</b></div>
      <div class="metric"><span>Job keywords</span><b>${a.total}</b></div>
      <div class="metric"><span>Truly missing</span><b>${a.miss.length}</b></div></div>
     <p class="small">${tip}</p>` +
    (a.hit.length ? `<p class="small">Already in your resume</p><div>${chips(a.hit,'ok')}</div>` : '') +
    (a.equiv.length ? `<p class="small">Can add honestly (your resume already proves these under another name)</p><div>${chips(a.equiv,'eq')}</div>` : '') +
    (a.miss.length ? `<p class="small">Missing. Add only the ones you have actually used.</p><div>${chips(a.miss,'miss')}</div>` : '');
  $('matchCard').classList.remove('hidden');
}

function validate(){
  if ($('jd').value.trim().length < 50) { msg('jdMsg','Paste the full job description first.','err'); return false; }
  if ($('resume').value.trim().length < 100) { msg('jdMsg','Your base resume looks empty. Tap Restore original.','err'); return false; }
  return true;
}

$('checkBtn').onclick = () => { if (validate()) { msg('jdMsg',''); renderMatch(analyze($('jd').value, $('resume').value)); } };

function buildPrompt(jd, rs, a){
  const role = $('role').value.trim(), co = $('company').value.trim();
  return `You are an expert resume writer and ATS specialist. Tailor the candidate's resume to the job description below. This must work for any role, so follow the job description's own language rather than a fixed template.

Strict rules:
1. Keep the same sections, in the same order and with the same headings, as the candidate's resume. It must still fit on one page.
2. Never invent anything. Keep every company, job title, date, project, feature, technology, metric and number exactly as given. Do not add tools, skills, responsibilities or experience that the resume does not already show.
3. Do not exaggerate. Keep the strength of each claim: do not upgrade verbs (for example "Built" must not become "Architected", "Led", "Spearheaded" or "Owned"), and never describe the candidate as an expert, senior or lead.
4. Do not change what a technology does, and do not remove details. Every bullet in the original must still be present (rewording is fine), including every feature and tool it mentions.
5. Use the job's exact wording where the resume already proves the skill. These job terms are honestly supported by the resume, so add them in the job's exact wording where they fit naturally (summary, skills, or the bullet that proves them): ${a.equiv.join(', ') || 'none'}.
6. Rewrite the summary in 2-3 lines for this role, using only job terms the candidate genuinely has.
7. Reorder skills within each category so the job's skills come first, and reorder bullets and blocks so the most relevant ones come first. Keep the existing skill categories and never merge unrelated items into one category. You may rename a category only if the new name is accurate.
8. Start every bullet with a strong but accurate action verb. Keep each bullet under about 30 words.
9. Output plain text only. No markdown, no asterisks, no # symbols. Section headings in CAPITALS on their own line. Bullets start with "• ". Keep job titles, company lines, project headings and education lines on their own lines as in the original.
10. After the resume, write a line containing only ===NOTES=== and then: (a) 3-5 short lines on what you changed, (b) important job skills that are still missing, so the candidate can decide whether they genuinely have them.

${role ? 'Target role: ' + role + '\n' : ''}${co ? 'Company: ' + co + '\n' : ''}Job keywords still missing (do NOT add these): ${a.miss.join(', ') || 'none'}

JOB DESCRIPTION:
${jd}

RESUME:
${rs}`;
}

function honestyCheck(orig, out){
  const warn = [];
  const risky = ["architected","spearheaded","led","headed","orchestrated","pioneered","owned","expert","senior","lead","mentored","managed a team"];
  const added = risky.filter(w => { const r = mk([w]); return r.test(out) && !r.test(orig); });
  if (added.length) warn.push('New strong claims to double-check: ' + added.join(', '));
  const nums = s => new Set((s.match(/\d+(?:\.\d+)?%?\+?/g) || []));
  const a = nums(orig), b = nums(out);
  const lost = [...a].filter(x => !b.has(x)), extra = [...b].filter(x => !a.has(x));
  if (lost.length) warn.push('Numbers from your resume that are missing now: ' + lost.join(', '));
  if (extra.length) warn.push('New numbers that are not in your base resume: ' + extra.join(', '));
  return warn;
}

$('tailorBtn').onclick = async () => {
  if (!validate()) return;
  const key = $('apiKey').value.trim();
  if (!key) return msg('jdMsg','Add your Gemini API key in Settings first.','err');
  if (navigator.onLine === false) return msg('jdMsg','You are offline. Connect to the internet and try again.','err');
  store.set('rt_key', key);

  const jd = $('jd').value.trim(), rs = $('resume').value.trim();
  const before = analyze(jd, rs);
  renderMatch(before);

  const btn = $('tailorBtn'); btn.disabled = true; msg('jdMsg','');
  try {
    if (!store.get('rt_models_loaded')) { btn.textContent = 'Loading models…'; try { await fetchModels(key); } catch(e) {} }
    const models = orderModels();
    const prompt = buildPrompt(jd, rs, before);
    const failures = [];
    let text = '', used = '';

    for (let i = 0; i < models.length; i++) {
      const m = models[i];
      btn.textContent = `Trying ${m} (${i+1} of ${models.length})…`;
      try { text = await callModel(m, key, prompt); used = m; break; }
      catch(e) {
        if (isKeyError(e)) throw new Error('Your API key was rejected. Check it in Settings.\n' + shortMsg(e.message));
        failures.push(`${m}: ${shortMsg(e.message)}`);
      }
    }
    if (!text) throw new Error('All ' + models.length + ' models failed. Your free-tier limit may be used up for today; try again later.\n\n' + failures.join('\n'));

    store.set('rt_model', used); $('model').value = used;
    const [resPart, notesPart] = text.split('===NOTES===');
    const clean = resPart.replace(/\*\*/g,'').replace(/^#+\s*/gm,'').trim();
    $('output').value = clean;

    const after = analyze(jd, clean);
    $('afterOut').textContent = `Keyword match: ${before.score}% before → ${after.score}% after (honest potential ${before.potential}%). Made with ${used}` +
      (failures.length ? `, after ${failures.length} model${failures.length > 1 ? 's' : ''} failed` : '') +
      '. Review every line; you must be able to explain it in an interview.';

    const warns = honestyCheck(rs, clean);
    if (warns.length) { $('warnOut').textContent = 'Honesty check:\n' + warns.join('\n'); $('warnOut').classList.remove('hidden'); }
    else $('warnOut').classList.add('hidden');

    if (notesPart && notesPart.trim()) { $('notes').textContent = notesPart.trim(); $('notes').classList.remove('hidden'); }
    else $('notes').classList.add('hidden');
    $('resultCard').classList.remove('hidden');
    $('resultCard').scrollIntoView({behavior:'smooth'});
  } catch(e) {
    msg('jdMsg', e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Tailor my resume';
  }
};

$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText($('output').value); }
  catch(e) { $('output').select(); document.execCommand('copy'); }
  msg('outMsg','Copied.','ok');
};

function resumeToHtml(text){
  let html = '', inList = false, first = true, seenHeading = false, section = '';
  const close = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of text.split('\n')) {
    const l = raw.trim();
    if (!l) { close(); continue; }
    if (first) { html += `<h1>${escH(l)}</h1>`; first = false; continue; }
    if (/^[•\-–*]\s+/.test(l)) {
      if (!inList) { html += '<ul>'; inList = true; }
      let t = escH(l.replace(/^[•\-–*]\s+/,''));
      const i = t.indexOf(':');
      if (section === 'SKILLS' && i > 0 && i < 45) t = '<b>' + t.slice(0, i + 1) + '</b>' + t.slice(i + 1);
      html += `<li>${t}</li>`; continue;
    }
    close();
    if (l.length < 45 && l === l.toUpperCase() && /[A-Z]/.test(l)) { section = l; seenHeading = true; html += `<h2>${escH(l)}</h2>`; continue; }
    if (!seenHeading) { html += `<p class="c">${escH(l)}</p>`; continue; }
    const strong = /^(EXPERIENCE|PROJECTS|EDUCATION)$/.test(section) && !/\b(19|20)\d{2}\b/.test(l);
    html += strong ? `<p><b>${escH(l)}</b></p>` : `<p>${escH(l)}</p>`;
  }
  close();
  return html;
}

$('pdfBtn').onclick = () => {
  const text = $('output').value.trim();
  if (!text) return msg('outMsg','Nothing to download yet.','err');
  const name = (text.split('\n')[0] || 'Resume').trim().replace(/\s+/g,'_');
  const co = $('company').value.trim().replace(/\s+/g,'_');
  const oldTitle = document.title;
  document.title = name + '_Resume' + (co ? '_' + co : '');
  $('printArea').innerHTML = resumeToHtml(text);
  window.addEventListener('afterprint', () => { document.title = oldTitle; }, {once:true});
  window.print();
};
